events {}
http {
  server {
    listen 80;

    location /api/ {
      proxy_pass http://api:4000/;
    }

    location /sync/ {
      proxy_pass http://sync:4001/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location / {
      proxy_pass http://web:3000/;
    }
  }
}
