events {}
http {
  # Round-robin across both sync nodes; a node that refuses connections is skipped
  # for 10s (max_fails/fail_timeout), so new connections go to the live one.
  upstream sync_nodes {
    server sync1:4001 max_fails=1 fail_timeout=10s;
    server sync2:4001 max_fails=1 fail_timeout=10s;
  }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://api:4000/;
    }

    location /sync/ {
      proxy_pass http://sync_nodes/;
      proxy_next_upstream error timeout;
      proxy_read_timeout 3600s;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location / {
      proxy_pass http://web:3000/;
    }
  }
}
