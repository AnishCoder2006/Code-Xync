# Production composition: API, sync, worker, AI service + Nginx.
# Database = Supabase (external); this file has no postgres service.
version: "3.9"

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - sync1
      - sync2

  api:
    build: ../../services/api
    restart: unless-stopped
    env_file: ../../.env
    expose:
      - "4000"

  # Two sync nodes (Week 4 Task 6). Nginx balances WebSockets and HTTP across both;
  # Redis Pub/Sub relays edits between them. NODE_ID shows up in /health and logs.
  sync1:
    build: ../../services/sync
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ID: sync1
      SYNC_PORT: "4001"
    expose:
      - "4001"

  sync2:
    build: ../../services/sync
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ID: sync2
      SYNC_PORT: "4001"
    expose:
      - "4001"

  worker:
    build: ../../services/worker
    restart: unless-stopped
    env_file: ../../.env
    # Needs Docker socket access to spawn sandboxes — run on a separate VM in real prod (design doc 3.3)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  ai:
    build: ../../services/ai
    restart: unless-stopped
    env_file: ../../.env
    expose:
      - "8000"

  redis:
    image: redis:7
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  qdrantdata:
