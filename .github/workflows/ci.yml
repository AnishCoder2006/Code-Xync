name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codesync
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # TODO: install deps and run tests per service (api, worker, sync)
      - run: echo "wire up npm install / test steps per service"

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # TODO: start web + sync + redis, then run tests/playwright suite
      - run: echo "wire up Playwright convergence/reconnect/node-kill tests"

  attack-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codesync
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build sandbox images
        run: |
          docker build -f infra/docker/sandbox-images/node.Dockerfile -t codesync-sandbox-node .
          docker build -f infra/docker/sandbox-images/python.Dockerfile -t codesync-sandbox-python .
      - name: Push Database Schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codesync
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/codesync
        run: npx prisma db push --schema=prisma/schema.prisma
      - name: Run Attack Containment Suite
        env:
          REDIS_URL: redis://localhost:6380
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codesync
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/codesync
        run: npx tsx benchmarks/attacks/run_attacks.ts

