name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codesync
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # TODO: install deps and run tests per service (api, worker, sync)
      - run: echo "wire up npm install / test steps per service"

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # TODO: start web + sync + redis, then run tests/playwright suite
      - run: echo "wire up Playwright convergence/reconnect/node-kill tests"

  attack-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: build sandbox images, run each payload in benchmarks/attacks, assert containment
      - run: echo "wire up sandbox attack-payload containment checks"
